name: Deploy JT Digital World to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/deploy-cloudflare-pages.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build website
        run: npm run build:website

      - name: Validate required output
        run: |
          test -f dist/index.html
          test -f dist/home.html
          test -f dist/apps.html
          test -f dist/style.css

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Create replacement Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: jt-digital-world-new
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID GitHub Actions secrets."
            exit 1
          fi
          projects_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")"
          if printf '%s' "$projects_json" | node -e '
            let raw=""; process.stdin.on("data", c => raw += c); process.stdin.on("end", () => {
              const d=JSON.parse(raw);
              if (!d.success) process.exit(2);
              const exists=(d.result || []).some(p => p.name === process.env.PROJECT_NAME);
              process.exit(exists ? 0 : 1);
            });
          '; then
            echo "Cloudflare Pages project $PROJECT_NAME already exists."
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "Could not verify Cloudflare Pages projects from the Cloudflare API."
              exit "$status"
            fi
            npx wrangler pages project create "$PROJECT_NAME" --production-branch main
          fi

      - name: Deploy website and Pages Functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name jt-digital-world-new --branch main
