name: JT Command Agent - Daily Health Scans

on:
  schedule:
    # GitHub Actions schedules use UTC. Five daily runs.
    - cron: "0 0 * * *"
    - cron: "0 5 * * *"
    - cron: "0 10 * * *"
    - cron: "0 15 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "scripts/**"
      - ".github/workflows/jt-command-agent.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: jt-command-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    name: Audit website and app previews
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          mapfile -d "" files < <(find . -type f -name "*.js" -not -path "./.git/*" -not -path "./node_modules/*" -print0)
          if (( ${#files[@]} == 0 )); then echo "No JavaScript files found"; exit 1; fi
          for file in "${files[@]}"; do echo "Checking $file"; node --check "$file"; done
      - name: Run static audit
        id: audit
        run: python scripts/jt_command_agent_audit.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jt-command-agent-report
          path: jt-command-agent-report.md
          if-no-files-found: ignore
      - name: Open or update a maintenance issue on failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Command Agent] Website/app audit failed";
            const body = [
              "The scheduled JT Command Agent static audit failed.",
              "",
              "- Run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
              "- Branch: " + context.ref,
              "- Commit: " + context.sha,
              "",
              "Review the workflow log and attached audit report. This workflow reports problems only; it does not edit or deploy production code."
            ].join("\n");
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: "open", per_page: 100 });
            const existing = open.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [] });
            }
