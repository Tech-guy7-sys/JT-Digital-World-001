name: Import JT Digital World project

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-from-original.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-jt-digital-world
  cancel-in-progress: false

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy project files from the original repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Tech-guy7-sys/jt-digital-world.git /tmp/jt-source
          rsync -a --exclude='.git/' /tmp/jt-source/ ./
          git status --short

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to import."
            exit 0
          fi
          git commit -m "Import JT Digital World project files"
          git push origin HEAD:main
